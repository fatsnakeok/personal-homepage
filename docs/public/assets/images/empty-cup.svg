<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748b" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- 装饰圆形 -->
  <circle cx="150" cy="150" r="80" fill="#2563eb" opacity="0.05"/>
  <circle cx="650" cy="450" r="120" fill="#2563eb" opacity="0.05"/>
  <circle cx="400" cy="520" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- 茶杯主体 - 空杯 -->
  <g filter="url(#shadow)">
    <!-- 茶杯杯身 -->
    <path d="M250 280 L270 450 Q280 470 400 470 Q520 470 530 450 L550 280 Z" fill="url(#cup)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- 茶杯把手 -->
    <ellipse cx="570" cy="360" rx="40" ry="60" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <!-- 茶杯边缘 -->
    <ellipse cx="400" cy="280" rx="150" ry="30" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  
  <!-- 水滴装饰 -->
  <circle cx="340" cy="380" r="8" fill="#2563eb" opacity="0.3"/>
  <circle cx="380" cy="400" r="5" fill="#2563eb" opacity="0.2"/>
  <circle cx="420" cy="390" r="6" fill="#2563eb" opacity="0.25"/>
  
  <!-- 文字 -->
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#0f172a">空杯心态</text>
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#64748b">Empty Cup Mentality</text>
  
  <!-- 装饰线条 -->
  <line x1="200" y1="100" x2="280" y2="100" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
  <line x1="520" y1="100" x2="600" y2="100" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
</svg>
